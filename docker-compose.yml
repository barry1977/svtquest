services:
  svtquest:
    build:
      context: .
      dockerfile: Dockerfile
    image: svtquest:latest
    container_name: svtquest
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
